<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Assessment Result</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc,
                #e0f2fe
            );

            color: #1e293b;
        }

        .container {
            width: 90%;
            max-width: 650px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 45px 40px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.12),
                0 5px 15px rgba(15, 23, 42, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .icon {
            width: 85px;
            height: 85px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #dcfce7;
            color: #16a34a;

            font-size: 42px;
            font-weight: bold;

            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.15);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #0f172a;
        }

        h2 {
            font-size: 21px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 15px;
        }

        .description {
            font-size: 16px;
            line-height: 1.7;
            color: #64748b;
            margin-bottom: 30px;
        }

        .status-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 12px 25px;

            border-radius: 50px;

            background: #ecfdf5;
            border: 1px solid #bbf7d0;

            color: #15803d;

            font-size: 16px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: #22c55e;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;

            border-top: 1px solid #e2e8f0;

            font-size: 13px;
            color: #94a3b8;
        }

        .back-button {
            display: inline-block;

            margin-top: 25px;
            padding: 12px 28px;

            border-radius: 10px;

            background: #2563eb;
            color: white;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition: 0.3s;
        }

        .back-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);

            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }

        @media (max-width: 600px) {

            .result-card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="result-card">

            <div class="icon">
                ✓
            </div>

            <h1>{{ title }}</h1>

            <h2>{{ message }}</h2>

            <p class="description">
                {{ description }}
            </p>

            <div class="status-box">
                <span class="status-dot"></span>
                <span>{{ status }}</span>
            </div>

            <br>

            <a href="/" class="back-button">
                Back to Application
            </a>

            <div class="footer">
                Credit Assessment System
                <br>
                Your application has been processed successfully.
            </div>

        </div>

    </div>

</body>
</html>
