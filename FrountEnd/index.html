<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Assessment</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, rgba(212, 175, 55, 0.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(30, 58, 95, 0.35), transparent 40%),
                #07111f;

            color: #ffffff;
            padding: 50px 20px;
        }

        /* Main Container */

        .application-wrapper {
            width: 100%;
            max-width: 950px;
            margin: auto;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 20px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);
            overflow: hidden;
        }

        /* Header */

        .form-header {
            background:
                linear-gradient(
                    135deg,
                    #0d1b2e,
                    #132b48
                );

            padding: 35px 45px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

            position: relative;
        }

        .form-header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 45px;

            width: 80px;
            height: 3px;

            background: linear-gradient(
                90deg,
                #d4af37,
                #f6d77a
            );

            border-radius: 10px;
        }

        .brand {
            color: #d4af37;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .form-header h1 {
            font-family: 'Playfair Display', serif;

            font-size: 34px;
            font-weight: 700;

            color: #ffffff;

            margin-bottom: 8px;
        }

        .form-header p {
            color: #aebccc;
            font-size: 14px;
        }

        /* Form */

        .credit-form {
            padding: 40px 45px 45px;
        }

        /* Sections */

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 10px 0 25px;

            color: #f1f3f6;

            font-size: 15px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 20px;

            background: linear-gradient(
                180deg,
                #d4af37,
                #f6d77a
            );

            border-radius: 5px;
        }

        /* Grid */

        .form-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 22px 25px;

            margin-bottom: 35px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;

            color: #c7d0db;

            margin-bottom: 9px;
        }

        .form-group label span {
            color: #d4af37;
        }

        /* Inputs */

        .form-group input,
        .form-group select {
            width: 100%;

            height: 48px;

            padding: 0 15px;

            border: 1px solid #33465d;
            border-radius: 8px;

            background: #0b192a;

            color: #ffffff;

            font-family: 'Inter', sans-serif;
            font-size: 14px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .form-group input::placeholder {
            color: #68788b;
        }

        .form-group input:hover,
        .form-group select:hover {
            border-color: #526b86;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #d4af37;

            background: #0d1d31;

            box-shadow:
                0 0 0 3px rgba(212, 175, 55, 0.12);
        }

        /* Remove number arrows */

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 0.5;
        }

        /* Button Area */

        .button-area {
            display: flex;
            justify-content: flex-end;

            gap: 14px;

            padding-top: 10px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        button {
            min-width: 140px;
            height: 48px;

            padding: 0 25px;

            border: none;
            border-radius: 8px;

            font-family: 'Inter', sans-serif;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        /* Submit */

        .submit-btn {
            background: linear-gradient(
                135deg,
                #c99a24,
                #e4bd50
            );

            color: #101923;

            box-shadow:
                0 8px 20px rgba(212, 175, 55, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);

            background: linear-gradient(
                135deg,
                #d4af37,
                #f3d477
            );

            box-shadow:
                0 12px 25px rgba(212, 175, 55, 0.3);
        }

        /* Close */

        .close-btn {
            background: transparent;

            color: #b7c2cf;

            border: 1px solid #40536a;
        }

        .close-btn:hover {
            background: #18283b;

            border-color: #60758d;

            color: #ffffff;

            transform: translateY(-2px);
        }

        /* Footer */

        .form-footer {
            text-align: center;

            margin-top: 25px;

            color: #68788b;

            font-size: 12px;
        }



        /* Responsive */

        @media (max-width: 700px) {

            body {
                padding: 20px 12px;
            }

            .form-header {
                padding: 30px 25px;
            }

            .form-header h1 {
                font-size: 27px;
            }

            .credit-form {
                padding: 30px 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;

                gap: 18px;
            }

            .button-area {
                flex-direction: column-reverse;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>


    <div class="application-wrapper">

        <!-- Header -->

        <div class="form-header">

            <div class="brand">
                Premium Finance
            </div>

            <h1>Credit Assessment</h1>

            <p>
                Please provide your financial and personal information
                for credit evaluation.
            </p>

        </div>


        <!-- Form -->

        <form class="credit-form"
              action="http://127.0.0.1:8002/submit"
              method="POST">

            <div id="result" class="result-card"></div>

            <!-- Personal Information -->

            <div class="section-title">
                Personal Information
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Age <span>*</span></label>
                    <input
                        type="number"
                        name="age"
                        placeholder="Enter your age"
                    >
                </div>

                <div class="form-group">
                    <label>Marital Status <span>*</span></label>

                    <select name="marital_status">
                        <option value="">Select status</option>
                        <option>single</option>
                        <option>married</option>
                        <option>divorced</option>
                        <option>widowed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Dependents <span>*</span></label>

                    <input
                        type="number"
                        name="dependents"
                        placeholder="Number of dependents"
                    >
                </div>

                <div class="form-group">
                    <label>Education <span>*</span></label>

                    <select name="education">
                        <option value="">Select education</option>
                        <option>high school</option>
                        <option>graduation</option>
                        <option>post-grad</option>
                        <option>bachelor</option>
                        <option>master</option>
                        <option>doctorate</option>
                        <option>other</option>

                    </select>
                </div>

            </div>


            <!-- Employment Information -->

            <div class="section-title">
                Employment Information
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Employment Status <span>*</span></label>

                    <select name="employment_status">
                        <option value="">Select status</option>
                        <option>student</option>
                        <option>self-employed</option>
                        <option>unemployed</option>
                        <option>salaried</option>
                        <option>retired</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Years Of Employment <span>*</span></label>

                    <input
                        type="number"
                        name="years_employed"
                        placeholder="Years employed"
                    >
                </div>

                <div class="form-group">
                    <label>Annual Income <span>*</span></label>

                    <input
                        type="number"
                        name="annual_income"
                        placeholder="Enter annual income"
                    >
                </div>

                <div class="form-group">
                    <label>Housing Type <span>*</span></label>

                    <select name="housing_type">
                        <option value="">Select housing type</option>
                        <option>own</option>
                        <option>rent</option>
                        <option>mortgage</option>
                        <option>with parents</option>
                        <option>unemployed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Years At Residence <span>*</span></label>

                    <input
                        type="number"
                        name="years_at_residence"
                        placeholder="Years at current residence"
                    >
                </div>

            </div>


            <!-- Credit Information -->

            <div class="section-title">
                Credit Information
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Bureau Score <span>*</span></label>

                    <input
                        type="number"
                        name="bureau_score"
                        placeholder="Enter bureau score"
                    >
                </div>

                <div class="form-group">
                    <label>Number Of Existing Cards <span>*</span></label>

                    <input
                        type="number"
                        name="existing_cards"
                        placeholder="Existing credit cards"
                    >
                </div>

                <div class="form-group">
                    <label>Total Existing Debt <span>*</span></label>

                    <input
                        type="number"
                        name="existing_debt"
                        placeholder="Total existing debt"
                    >
                </div>

                <div class="form-group">
                    <label>Requested Credit Limit <span>*</span></label>

                    <input
                        type="number"
                        name="credit_limit"
                        placeholder="Requested credit limit"
                    >
                </div>

            </div>


            <!-- Buttons -->

            <div class="button-area">

                <button
                    type="button"
                    class="close-btn"
                    onclick="window.close()"
                >
                    Close
                </button>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Application
                </button>

            </div>

            <div class="form-footer">
                Your information is securely processed for credit assessment.
            </div>

        </form>

    </div>

</body>



</html>
